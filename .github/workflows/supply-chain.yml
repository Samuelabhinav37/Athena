name: Athena Supply Chain

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and pinned analysis tools
        run: >-
          python -m pip install -e .
          pip-audit==2.10.1
          cyclonedx-bom==7.3.1

      - name: Audit Python dependencies
        run: python -m pip_audit --strict

      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p artifacts/supply-chain
          cyclonedx-py environment --output-format JSON --output-file artifacts/supply-chain/python-sbom.json

      - name: Build runtime images
        run: |
          docker build --file apps/api/Dockerfile --tag athena-api:${{ github.sha }} .
          docker build --file apps/web/Dockerfile --tag athena-web:${{ github.sha }} .

      - name: Scan runtime images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --exit-code 1 --severity HIGH,CRITICAL athena-api:${{ github.sha }}
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 image --exit-code 1 --severity HIGH,CRITICAL athena-web:${{ github.sha }}

      - name: Record artifact digests
        run: sha256sum artifacts/supply-chain/* > artifacts/supply-chain/SHA256SUMS

      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: athena-supply-chain-${{ github.run_id }}
          path: artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 30
