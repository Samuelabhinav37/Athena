services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-athena}
      POSTGRES_USER: ${POSTGRES_USER:-athena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athena}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-athena.json:/opt/keycloak/data/import/realm-athena.json:ro

  opa:
    image: openpolicyagent/opa:1.4.2
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=info
      - /policies/iam
      - /policies/system
    ports:
      - "8181:8181"
    volumes:
      - ./policies:/policies:ro

  neo4j:
    image: neo4j:2026.06.0-community
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:?Set NEO4J_AUTH for the graph service}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7474"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  neo4j-data:
