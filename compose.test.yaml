services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: athena_test
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: disposable-owner
      ATHENA_APP_DB_PASSWORD: disposable-app
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./infra/postgres/init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athena -d athena_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres-tests:
    image: python:3.13.14-slim-bookworm
    working_dir: /workspace
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      ATHENA_DATABASE_URL: postgresql+psycopg://athena_app:disposable-app@postgres-test:5432/athena_test
      ATHENA_MIGRATION_DATABASE_URL: postgresql+psycopg://athena:disposable-owner@postgres-test:5432/athena_test
      ATHENA_TEST_DATABASE_URL: postgresql+psycopg://athena:disposable-owner@postgres-test:5432/athena_test
      ATHENA_AUTH_REQUIRED: "false"
      ATHENA_API_WORKER_COUNT: "1"
      ATHENA_API_REPLICA_COUNT: "1"
    volumes:
      - .:/workspace:ro
    command:
      - /bin/sh
      - -ec
      - >-
        python -m pip install --disable-pip-version-check -e '.[dev]' &&
        python -m alembic upgrade head &&
        python -m alembic check &&
        python -m pytest -q tests/test_tenant_backfill_postgres.py &&
        python -m pytest -q tests/test_tenant_constraints_postgres.py &&
        python -m pytest -q --ignore=tests/test_tenant_backfill_postgres.py
        --ignore=tests/test_tenant_constraints_postgres.py

volumes:
  postgres-test-data:
